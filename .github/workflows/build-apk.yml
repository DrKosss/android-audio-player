name: Build Šaptač APK

on:
  workflow_dispatch:
  push:
    branches: [ arena/df83641e-android-audio-player ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: arena/df83641e-android-audio-player
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Environment, wrapper, key and build
        id: build
        shell: bash
        run: |
          set +e
          {
            echo "===== ENVIRONMENT ====="
            java -version 2>&1
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls -la "$ANDROID_HOME" || true
            ls -la "$ANDROID_HOME/platforms" || true
            ls -la "$ANDROID_HOME/build-tools" || true
            echo "sdkmanager: $(command -v sdkmanager || true)"
            echo "gradle: $(command -v gradle || true)"
            gradle --version 2>&1 || true
            echo "===== SDK COMPONENTS ====="
            SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
              "$SDKM" "platforms;android-35" 2>&1 || true
            fi
            if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
              "$SDKM" "build-tools;35.0.0" 2>&1 || true
            fi
            echo "--- API 37 candidates ---"
            for d in "$ANDROID_HOME/platforms"/android-37*; do
              [ -d "$d" ] || continue
              echo "$d: $(grep AndroidVersion.ApiLevel "$d/source.properties" 2>/dev/null || true)"
            done
            if [ -f "$ANDROID_HOME/platforms/android-37.2/source.properties" ]; then
              echo "--- android-37.2 source.properties ---"
              cat "$ANDROID_HOME/platforms/android-37.2/source.properties"
            fi
            # AGP resolves compileSdk=37 to the canonical path platforms/android-37.
            # The runner ships API 37 as android-37.2; make a canonical, patched copy.
            if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.2" ]; then
              cp -a "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37"
              sed -i 's/^AndroidVersion\.ApiLevel=.*/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/^AndroidVersion\.CodeName=.*/AndroidVersion.CodeName=REL/' "$ANDROID_HOME/platforms/android-37/source.properties"
              if [ -f "$ANDROID_HOME/platforms/android-37/package.xml" ]; then
                sed -i 's/platforms;android-37\.2/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml"
                sed -i 's|<api-level>37\.2</api-level>|<api-level>37</api-level>|g' "$ANDROID_HOME/platforms/android-37/package.xml"
                echo "--- canonical android-37 package.xml identity ---"
                grep -E 'localPackage|api-level|display-name' "$ANDROID_HOME/platforms/android-37/package.xml" | head -12 || true
              fi
              echo "--- canonical android-37 source.properties ---"
              cat "$ANDROID_HOME/platforms/android-37/source.properties"
            fi
            echo "===== SIGNING KEY ====="
            mkdir -p signing
            if [ ! -f signing/saptac.jks ]; then
              keytool -genkeypair -alias saptac -keyalg RSA -keysize 2048 -validity 10950 \
                -keystore signing/saptac.jks -storepass saptac2026 -keypass saptac2026 \
                -dname "CN=Saptac, OU=Personal, O=Saptac, L=Krusevac, ST=Serbia, C=RS" 2>&1
            else
              echo "existing key reused"
            fi
            echo "===== GRADLE WRAPPER ====="
            GRADLE=gradle
            if ! command -v gradle >/dev/null 2>&1; then
              wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip || true
              unzip -q -o /tmp/gradle.zip -d /tmp/gradle-dist || true
              GRADLE=/tmp/gradle-dist/gradle-8.9/bin/gradle
            fi
            "$GRADLE" wrapper --gradle-version 8.9 --distribution-type bin --no-daemon 2>&1
            echo "===== ASSEMBLE RELEASE ====="
            ./gradlew assembleRelease --stacktrace --no-daemon 2>&1
            echo "ASSEMBLE_EXIT=$?"
          } | tee build.log
          echo "===== done =====" >> build.log
          exit 0

      - name: Collect APK
        if: always()
        run: |
          mkdir -p dist
          rm -f dist/Saptac-v1.0.apk dist/Saptac-v1.0.apk.sha256
          APK=$(find app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' | head -1 || true)
          if [ -n "$APK" ]; then cp "$APK" dist/Saptac-v1.0.apk; fi
          if [ -f dist/Saptac-v1.0.apk ]; then
            ls -lh dist/Saptac-v1.0.apk
            sha256sum dist/Saptac-v1.0.apk > dist/Saptac-v1.0.apk.sha256
          fi

      - name: Verify signed APK and print manifest
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "===== APK VERIFICATION ====="
            if [ -f dist/Saptac-v1.0.apk ]; then
              BT="$ANDROID_HOME/build-tools/35.0.0"
              "$BT/apksigner" verify --verbose --print-certs dist/Saptac-v1.0.apk 2>&1
              echo "--- aapt badging ---"
              "$BT/aapt" dump badging dist/Saptac-v1.0.apk 2>&1 | head -24
              echo "--- sha256 ---"
              sha256sum dist/Saptac-v1.0.apk
              echo "--- size ---"
              stat -c '%s bytes' dist/Saptac-v1.0.apk
            else
              echo "NO APK PRODUCED"
            fi
          } | tee -a build.log
          exit 0

      - name: Publish APK and build log back to the branch
        if: always()
        shell: bash
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -A dist
          for f in build.log signing/saptac.jks .gitignore gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "CI: APK i log izgradnje [skip ci]" || echo "nothing new to commit"
          git push origin HEAD:${{ github.ref_name }} || true
