name: Build probe
on:
  workflow_dispatch:
  push:
    branches: [ arena/df83641e-android-audio-player ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "ACTIONS OK $(date -u)" > probe.txt
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5
      - name: Publish probe file back to branch
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add probe.txt
          git commit -m "CI probe [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
